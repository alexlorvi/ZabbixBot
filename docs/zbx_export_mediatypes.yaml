zabbix_export:
  version: '7.4'
  media_types:
    - name: 'ZabbixBot'
      type: 'WEBHOOK'
      parameters:
        - name: 'event_id'
          value: '{EVENT.ID}'
        - name: 'event_update_status'
          value: '{EVENT.UPDATE.STATUS}'
        - name: 'event_value'
          value: '{EVENT.VALUE}'
        - name: 'http_proxy'
          value: ''
        - name: 'lang'
          value: 'ua'
        - name: 'message'
          value: '{ALERT.MESSAGE}'
        - name: 'parse_mode'
          value: 'html'
        - name: 'sendto'
          value: '{ALERT.SENDTO}'
        - name: 'subject'
          value: '{ALERT.SUBJECT}'
        - name: 'token'
          value: '<alerts.token>'
        - name: 'url'
          value: 'https://<bot-host>/alert.php'
      script: |
        // Скрипт webhook-медіатипу Zabbix: передає сповіщення в alert.php бота.
        // Медіатип цілком (параметри, шаблони) генерує `php console.php app:mediatype export|install`,
        // цей файл - джерело його скрипта (MediaTypeDefinition).
        //
        // Службові параметри: url (https://<host>/alert.php), token (alerts.token), http_proxy (необов'язково).
        // Решта пересилаються в alert.php як є: sendto, subject, message, parse_mode, event_id, event_value,
        // event_update_status, lang (мова кнопок квитування).
        var SERVICE = ['url', 'token', 'http_proxy'];

        function escapeMarkup(str, mode) {
            switch (mode) {
                case 'markdown':
                    return str.replace(/([_*\[`])/g, '\\$&');
                case 'markdownv2':
                    return str.replace(/([_*\[\]()~`>#+\-=|{}.!])/g, '\\$&');
                case 'html':
                    // теги шаблону лишаються, "<" з даних (напр. "a < b" у назві) - ні
                    return str.replace(/<(\s|[^a-z\/])/g, '&lt;$1');
                default:
                    return str;
            }
        }

        try {
            var params = JSON.parse(value),
                body = {},
                req = new HttpRequest(),
                resp;

            Object.keys(params).forEach(function (key) {
                if (SERVICE.indexOf(key) !== -1) {
                    return;
                }
                body[key] = params[key];
            });

            var mode = (body.parse_mode || '').toLowerCase();
            if (['markdown', 'markdownv2', 'html'].indexOf(mode) !== -1) {
                body.subject = escapeMarkup(body.subject || '', mode);
                body.message = escapeMarkup(body.message || '', mode);
            }

            if (params.http_proxy) {
                req.setProxy(params.http_proxy);
            }
            req.addHeader('Content-Type: application/json');
            req.addHeader('X-Alert-Token: ' + params.token);
            resp = req.post(params.url, JSON.stringify(body));

            if (req.getStatus() !== 200) {
                throw 'HTTP ' + req.getStatus() + ': ' + resp;
            }
            return 'OK: ' + resp;
        } catch (error) {
            Zabbix.log(3, '[ZabbixBot alert] ' + error);
            throw 'Sending failed: ' + error;
        }
      timeout: '10s'
      process_tags: 'YES'
      description: |
        ZabbixBot: сповіщення в Telegram через бота (alert.php) / notifications to Telegram via the bot.

        UA: Send to (у media користувача) = його Telegram chat id. Відновлення й оновлення приходять відповіддю на проблему,
        під проблемою - кнопки "Квитувати"/"Коментар". url/token - з config.php бота (alerts.url, alerts.token),
        lang - мова кнопок. Створено: php console.php app:mediatype install --lang=ua|en

        EN: Send to (in the user's media) = Telegram chat id. Recovery and updates are sent as replies to the problem,
        the problem has "Acknowledge"/"Comment" buttons. url/token come from the bot's config.php (alerts.url,
        alerts.token), lang is the buttons' language. Created by: php console.php app:mediatype install --lang=ua|en
      message_templates:
        - event_source: 'TRIGGERS'
          operation_mode: 'PROBLEM'
          subject: '⛔ Виявлено проблему {EVENT.DATE} о {EVENT.TIME}'
          message: |
            <b>Хост:</b> <i>{HOST.NAME} ({HOST.IP1})</i>
            <b>Назва проблеми:</b> <i>{EVENT.NAME}</i>
            <b>Рейтинг АЗК:</b> <i>{INVENTORY.TAG}</i>
            <b>Супутні теги:</b> <i>{EVENT.TAGS}</i>
            <b>Рівень обслуговування:</b> <i>{EVENT.SEVERITY}</i>

            <b>Операційні дані:</b> <i>{EVENT.OPDATA}</i>

            <b>Опис проблеми:</b>
            {TRIGGER.DESCRIPTION}

            {TRIGGER.URL}
            /ev{EVENT.ID}
        - event_source: 'TRIGGERS'
          operation_mode: 'RECOVERY'
          subject: '✅ Проблему усунуто {EVENT.RECOVERY.DATE} о {EVENT.RECOVERY.TIME}'
          message: |
            <b>Хост:</b> <i>{HOST.NAME} ({HOST.IP1})</i>
            <b>Назва проблеми:</b> <i>{EVENT.RECOVERY.NAME}</i>
            <b>Рейтинг АЗК:</b> <i>{INVENTORY.TAG}</i>
            <b>Супутні теги:</b> <i>{EVENT.RECOVERY.TAGS}</i>
            <b>Рівень обслуговування:</b> <i>{EVENT.SEVERITY}</i>

            <b>Тривалість проблеми:</b> <i>{EVENT.DURATION}</i>
            {TRIGGER.URL}

            Аптайм пристрою - /{?last(/{HOST.HOST}/sys.uptime[sysUpTime.0])}sec
            /ev{EVENT.ID}
        - event_source: 'TRIGGERS'
          operation_mode: 'UPDATE'
          subject: '💬 Оновлення проблеми: {EVENT.NAME}'
          message: |
            {USER.FULLNAME} {EVENT.UPDATE.ACTION} {EVENT.UPDATE.DATE} {EVENT.UPDATE.TIME}
            {EVENT.UPDATE.MESSAGE}

            Статус: {EVENT.STATUS}, квитовано: {EVENT.ACK.STATUS}
            /ev{EVENT.ID}
        - event_source: 'DISCOVERY'
          operation_mode: 'PROBLEM'
          subject: 'Виявлення: {DISCOVERY.DEVICE.STATUS} {DISCOVERY.DEVICE.IPADDRESS}'
          message: |
            Правило виявлення: {DISCOVERY.RULE.NAME}

            IP пристрою: {DISCOVERY.DEVICE.IPADDRESS}
            DNS пристрою: {DISCOVERY.DEVICE.DNS}
            Стан пристрою: {DISCOVERY.DEVICE.STATUS}
            Аптайм пристрою: {DISCOVERY.DEVICE.UPTIME}

            Сервіс: {DISCOVERY.SERVICE.NAME}
            Порт сервісу: {DISCOVERY.SERVICE.PORT}
            Стан сервісу: {DISCOVERY.SERVICE.STATUS}
            Аптайм сервісу: {DISCOVERY.SERVICE.UPTIME}
        - event_source: 'AUTOREGISTRATION'
          operation_mode: 'PROBLEM'
          subject: 'Автореєстрація: {HOST.HOST}'
          message: |
            Ім'я хоста: {HOST.HOST}
            IP хоста: {HOST.IP}
            Порт агента: {HOST.PORT}
